name: openchris-memory
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: conselho
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: conselho_demo
    ports:
      - "127.0.0.1:18432:5432"
    volumes:
      - memory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conselho -d conselho_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DATABASE_URL: postgres://conselho:synthetic-only@postgres:5432/conselho_demo?sslmode=disable
      DEMO_ONLY: "true"
      LISTEN_ADDR: :8080
      DEMO_PASSWORD: demo-conselho
      TELEGRAM_SECRET: synthetic-webhook
      BENCH_TOKEN: stack-benchmark-local
    ports:
      - "127.0.0.1:18480:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  memory_data:
