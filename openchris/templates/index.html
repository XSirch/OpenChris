<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#191c1f">
  <meta name="color-scheme" content="dark">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Hoje · OpenChris</title>
  <link rel="icon" href="{{ url_for('static', filename='marca.svg', v='carbono-3') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css', v='carbono-3') }}">
  <script type="module" src="{{ url_for('static', filename='app.js', v='carbono-3') }}"></script>
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <div class="app-shell">
    <div class="workspace">
      <header class="top">
        <div class="top-inner">
          <a class="brand mobile-brand" href="/hoje" data-route><img src="{{ url_for('static', filename='marca.svg', v='carbono-3') }}" alt="" width="24" height="24">OpenChris</a>
          <div class="top-date" id="top-date"></div>
          <button class="icon-btn profile-button" data-action="perfil" aria-label="Abrir perfil financeiro" title="Perfil financeiro"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.65" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 19a7.3 7.3 0 0 1 14 0"/></svg></button>
        </div>
      </header>
      <main id="conteudo" tabindex="-1" aria-busy="true"><p class="loading" role="status">Carregando…</p><noscript>Ative o JavaScript para consultar suas finanças.</noscript></main>
    </div>
    <aside class="rail">
      <a class="brand rail-brand" href="/hoje" data-route><img src="{{ url_for('static', filename='marca.svg', v='carbono-3') }}" alt="" width="24" height="24">OpenChris</a>
      <nav class="nav" aria-label="Navegação principal"><div id="nav-links"></div></nav>
    </aside>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-btn" data-action="fechar" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="dialog-body"></div>
    <p class="error" id="dialog-error" role="alert"></p>
    <p class="dialog-status" id="dialog-status" role="status"></p>
  </dialog>
  <div id="notice" class="toast" inert>
    <span id="notice-icon" class="toast-icon" aria-hidden="true"></span>
    <span id="notice-text"></span>
    <button type="button" class="icon-btn" aria-label="Dispensar notificação"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="notice-status" class="sr" role="status" aria-atomic="true"></div>
</body>
</html>
