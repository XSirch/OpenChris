<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Entrar · OpenChris</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#10151c;color:#f2f5fa;font:1rem/1.5 system-ui,sans-serif}
    main{width:min(28rem,100%);margin:clamp(2rem,12vh,7rem) auto;padding:1.5rem}
    .brand{font-weight:720;font-size:1.35rem;display:flex;align-items:center;gap:.65rem}
    .mark{width:1.1rem;height:1.1rem;background:linear-gradient(135deg,#94b5ff 45%,transparent 46% 54%,#94b5ff 55%)}
    h1{font-size:2.35rem;letter-spacing:-.035em;line-height:1.1;margin:3rem 0 1.6rem}
    label{display:block;margin-bottom:.4rem}input,button{width:100%;font:inherit;padding:.8rem 1rem;border-radius:.45rem}
    input{background:#19232d;color:#fff;border:1px solid #687689}button{margin-top:1.25rem;border:0;background:#a6c2ff;color:#10151c;font-weight:700;cursor:pointer}
    :focus-visible{outline:3px solid #adc6ff;outline-offset:3px}[role=alert]{color:#ffad96}
  </style>
</head>
<body><main>
  <div class="brand"><span class="mark" aria-hidden="true"></span>OpenChris</div>
  <h1>Entrar na sua conta</h1>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <button>Entrar</button>
  </form>
</main></body></html>
