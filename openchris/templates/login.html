<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#191c1f">
  <title>Entrar · OpenChris</title>
  <link rel="icon" href="{{ url_for('static', filename='marca.svg', v='carbono-3') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css', v='carbono-3') }}">
</head>
<body class="login"><main class="panel login-card">
  <div class="brand"><img src="{{ url_for('static', filename='marca.svg', v='carbono-3') }}" alt="" width="24" height="24">OpenChris</div>
  <h1>Entrar na sua conta</h1>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field" for="password">Senha<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button class="primary block">Entrar</button>
  </form>
</main></body></html>
