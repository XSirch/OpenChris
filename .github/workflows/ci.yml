name: Testes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: conselho
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: conselho_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U conselho -d conselho_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://conselho:synthetic-only@127.0.0.1:5432/conselho_test?sslmode=disable
      HTTP_TEST_DATABASE_URL: postgres://conselho:synthetic-only@127.0.0.1:5432/conselho_http_test?sslmode=disable
      FINANCE_TEST_DATABASE_URL: postgres://conselho:synthetic-only@127.0.0.1:5432/conselho_finance_test?sslmode=disable
      TELEGRAM_TEST_DATABASE_URL: postgres://conselho:synthetic-only@127.0.0.1:5432/conselho_telegram_test?sslmode=disable
      PLUGGY_TEST_DATABASE_URL: postgres://conselho:synthetic-only@127.0.0.1:5432/conselho_pluggy_test?sslmode=disable
      INTEGRATIONS_TEST_DATABASE_URL: postgres://conselho:synthetic-only@127.0.0.1:5432/conselho_integrations_test?sslmode=disable
      COUNCIL_TEST_DATABASE_URL: postgres://conselho:synthetic-only@127.0.0.1:5432/conselho_council_test?sslmode=disable
      AUTONOMY_TEST_DATABASE_URL: postgres://conselho:synthetic-only@127.0.0.1:5432/conselho_autonomy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE conselho_http_test'
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE conselho_finance_test'
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE conselho_telegram_test'
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE conselho_pluggy_test'
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE conselho_integrations_test'
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE conselho_council_test'
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE conselho_autonomy_test'
      - run: python scripts/check_encoding.py
      - run: go test ./... -count=1 -v
      - run: go vet ./...
      - run: node --test 'scripts/test-*.cjs'
      - run: python -m pip install -r bench/requirements.txt
      - run: python -m unittest discover -s bench/tests -v
