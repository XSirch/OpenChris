name: openchris-production
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: conselho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha exclusiva em .env.vps}
      POSTGRES_DB: conselho
    volumes:
      - memory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conselho -d conselho"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: "0.50"
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://conselho:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/conselho?sslmode=disable
      APP_ENV: production
      APP_PASSWORD: ${APP_PASSWORD:?Defina uma senha exclusiva de pelo menos 20 caracteres}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Defina a origem HTTPS pública}
      LISTEN_ADDR: :8080
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PLUGGY_ENABLED: ${PLUGGY_ENABLED:-false}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_WEBHOOK_SECRET: ${PLUGGY_WEBHOOK_SECRET:-}
      PLUGGY_SYNC_INTERVAL: ${PLUGGY_SYNC_INTERVAL:-6h}
      CODEX_ENABLED: ${CODEX_ENABLED:-false}
      CODEX_RUNNER_URL: http://conselho-codex:8081
      CODEX_RUNNER_TOKEN: ${CODEX_RUNNER_TOKEN:-}
      CODEX_DAILY_LIMIT: ${CODEX_DAILY_LIMIT:-30}
      AUTONOMY_ENABLED: ${AUTONOMY_ENABLED:-false}
      AUTONOMY_DAILY_LIMIT: ${AUTONOMY_DAILY_LIMIT:-20}
    ports:
      - "127.0.0.1:18480:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: "0.50"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  conselho-codex:
    profiles: [ai]
    build:
      context: .
      dockerfile: deploy/Dockerfile.codex-runner.source
    environment:
      CODEX_RUNNER_TOKEN: ${CODEX_RUNNER_TOKEN:-}
      CODEX_AUTH_KEY: ${CODEX_AUTH_KEY:-}
    volumes:
      - codex_auth:/state
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    read_only: true
    mem_limit: 768m
    cpus: "1.0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  memory_data:
  codex_auth:
